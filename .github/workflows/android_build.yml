name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Compile Production Web App
        run: npm run build

      - name: Install Capacitor CLI Globally
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build Android Debug APK
        run: |
          cd android
          gradle assembleDebug

      - name: Find and Rename APK
        run: |
          mkdir -p build-artifacts
          if [ ! -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK not found!"
            exit 1
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/FlowChatGames.apk
          echo "APK successfully compiled and prepared!"

      - name: Upload APK as Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowChatGames-APK
          path: build-artifacts/FlowChatGames.apk

      - name: Create or Update GitHub Release
        run: |
          gh release delete latest --yes || true
          gh release create latest build-artifacts/FlowChatGames.apk \
            --title "Latest Android Build" \
            --notes "This is an automated native compilation of the latest FlowChat Games Hub APK."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}