name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 'large'
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Compile Production Web App
        run: npm run build

      - name: Install Capacitor CLI Globally
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/FlowChatGames.apk
          echo "APK successfully compiled and prepared!"

      - name: Upload APK as Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowChatGames-APK
          path: build-artifacts/FlowChatGames.apk

      - name: Create or Update GitHub Release (Native gh CLI)
        run: |
          # Configure GitHub CLI release
          gh release create "latest" build-artifacts/FlowChatGames.apk \
            --title "Latest Android Build" \
            --notes "This is an automated native compilation of the latest FlowChat Games Hub APK." \
            --clobber || \
          gh release upload "latest" build-artifacts/FlowChatGames.apk --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
