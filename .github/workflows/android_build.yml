name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-size: 'large'
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Compile Production Web App
        run: npm run build

      - name: Install Capacitor CLI Globally
        run: npm install -g @capacitor/cli

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Find and Rename APK
        run: |
          mkdir -p build-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk build-artifacts/FlowChatGames.apk
          echo "APK successfully compiled and prepared!"

      - name: Upload APK as Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowChatGames-APK
          path: build-artifacts/FlowChatGames.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'latest' || (github.ref_name == 'master' && 'latest' || github.ref_name) }}
          name: ${{ github.ref_name == 'main' && 'Latest Release' || (github.ref_name == 'master' && 'Latest Android Release' || concat('Release ', github.ref_name)) }}
          draft: false
          prerelease: false
          files: build-artifacts/FlowChatGames.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
